[project]
name = "kisholens"
version = "0.1.0"
description = "Stylistic pacing and prose archetype analysis for web novels and light fiction"
readme = "README.md"
requires-python = ">=3.10"

# KishoLens uses a single flat uv package (not a workspace).
# All services (api, ml, pipeline) are submodules of the `kisholens` package.
# Run with: uv run uvicorn kisholens.api.main:app --reload
# NLP extras (spacy, sudachipy) require Python <=3.13: uv sync --extra nlp
dependencies = [
    # API
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    # Data layer
    "sqlmodel>=0.0.8",
    # HTTP client
    "aiohttp>=3.8.0",
    # HTML parsing
    "lxml>=4.9.0",
    "beautifulsoup4>=4.12.0",
    # Data validation
    "pydantic>=2.0",
    # NLP - English (pinned to last version with py3.13 wheels)
    "nltk>=3.8.1",
    "datasets>=2.12.0",
]

[project.optional-dependencies]
# NLP extras require Python <=3.13 until spaCy publishes 3.14 wheels
nlp = [
    "spacy>=3.5.0",
    "sudachipy>=0.6.7",
    "sudachidict-core>=20230110",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kisholens"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
